# Custom Resource example
#
# Use your own values for these fields:
# * metadata.name
# * spec.name
# * spec.connInfoSecretTarget.name
#
apiVersion: databases.scalingo.com/v1
kind: OpenSearch
metadata:
  labels:
    app.kubernetes.io/name: scalingo-operator
    app.kubernetes.io/managed-by: kustomize
  name: opensearch-sample
spec:
  authSecret:
    name: scalingo
    key: api_token
  connInfoSecretTarget:
    name: my-opensearch-secret

  networking:
    internet_access:
      enabled: true
    firewall:
      rules:
        - type: "custom_range"
          cidr: "0.0.0.0/0"
          label: "Allow all"

  name: my-opensearch-database
  plan: opensearch-dr-starter-8192
  region: osc-fr1
